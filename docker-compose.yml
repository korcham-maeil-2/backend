# 월급지도 배포 구성 (라즈베리파이 홈랩)
#
# 실행:  docker compose up -d --build
# 로그:  docker compose logs -f backend
# 중지:  docker compose down          (볼륨의 SQLite는 남는다. 지우려면 down -v)
#
# 구조: 인터넷 → 서버의 Nginx(HTTPS) → 127.0.0.1:${BACKEND_PORT} → backend 컨테이너
# 프론트 서비스는 프론트 배포 때 이 파일에 추가한다 (../frontend).

services:
  backend:
    build: .
    image: wolgeup-backend
    container_name: wolgeup-backend
    restart: unless-stopped
    # API 키 등은 서버의 backend/.env에 둔다 (저장소에 올리지 않음, 형식은 .env.example)
    env_file:
      - path: .env
        required: false
    environment:
      CHECKPOINT_DB_PATH: /data/checkpoints.sqlite
      # 브라우저 호출을 허락할 프론트 주소 (쉼표로 여러 개)
      CORS_ORIGINS: ${CORS_ORIGINS:-https://wolgeup.sunghoyaaa.com,http://localhost:3000}
    volumes:
      - backend-data:/data
    # 서버 안에서만 열고(127.0.0.1), 바깥에서는 Nginx를 거쳐서만 들어오게 한다
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  # 세션 상태 SQLite 파일이 저장되는 곳. 컨테이너를 다시 만들어도 남는다.
  backend-data:
    name: wolgeup-backend-data
